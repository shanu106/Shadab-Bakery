<div class="top-bar">
  <input
    type="text"
    placeholder="Search tasks..."
    [(ngModel)]="searchText"
    (input)="filterTasks()"
    class="search-input"
  />

  <button class="btn new-btn" (click)="openAddTaskModal()">+ New Task</button>
  <button class="btn add-btn" (click)="openAddTaskModal()">+ Add Task</button>
</div>

<div class="board">
  <!-- TO DO -->
  <div class="column"
       id="todo-list"
       cdkDropList
       cdkDropListGroup="taskGroup"
       [cdkDropListData]="todoTasks"
       (cdkDropListDropped)="onDrop($event)">

    <h3>To Do</h3>

    <div *ngFor="let task of todoTasks"
         class="task-card"
         cdkDrag
         [cdkDragData]="task">

      <h4>{{task.title}}</h4>
      <p>{{task.description}}</p>
      <button (click)="editTask(task)">Edit</button>

    </div>
  </div>

  <!-- IN PROGRESS -->
  <div class="column"
       id="inprogress-list"
       cdkDropList
       cdkDropListGroup="taskGroup"
       [cdkDropListData]="inprogressTasks"
       (cdkDropListDropped)="onDrop($event)">

    <h3>In Progress</h3>

    <div *ngFor="let task of inprogressTasks"
         class="task-card"
         cdkDrag
         [cdkDragData]="task">

      <h4>{{task.title}}</h4>
      <p>{{task.description}}</p>
      <button (click)="editTask(task)">Edit</button>

    </div>
  </div>

  <!-- DONE -->
  <div class="column"
       id="done-list"
       cdkDropList
       cdkDropListGroup="taskGroup"
       [cdkDropListData]="doneTasks"
       (cdkDropListDropped)="onDrop($event)">

    <h3>Done</h3>

    <div *ngFor="let task of doneTasks"
         class="task-card"
         cdkDrag
         [cdkDragData]="task">

      <h4>{{task.title}}</h4>
      <p>{{task.description}}</p>
      <button (click)="editTask(task)">Edit</button>

    </div>
  </div>
</div>

<div class="modal" *ngIf="showTaskModal">
  <div class="modal-content">
    <h2>{{ isEditMode ? 'Edit Task' : 'Add Task' }}</h2>

    <input [(ngModel)]="taskForm.title" placeholder="Title" />
    <textarea [(ngModel)]="taskForm.description" placeholder="Description"></textarea>

    <select [(ngModel)]="taskForm.status">
      <option value="todo">To Do</option>
      <option value="inprogress">In Progress</option>
      <option value="done">Done</option>
    </select>

    <button (click)="saveTask()">Save</button>
    <button (click)="closeModal()">Cancel</button>
  </div>
</div>
